<script>
(function(){var p=location.pathname.toLowerCase(),r=location.pathname+location.search+location.hash,t;
if(p.indexOf('/chibwe')===0){t='https://chibwe.org'+location.pathname.replace(/^\/chibwe/i,'')}

</script></head>
